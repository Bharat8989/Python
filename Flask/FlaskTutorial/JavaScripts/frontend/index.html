<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Registration Form</h2>

        <!-- Inline alert for feedback messages -->
        <div id="alertBox" class="alert" style="display: none;" role="alert" aria-live="polite"></div>

        <form id="studentForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter full name" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter email address" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required placeholder="Enter age" min="1" max="120">
            </div>
            <div class="form-group">
                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required placeholder="Enter course name">
            </div>
            <button type="submit" id="submitBtn">Submit Registration</button>
        </form>

        <hr>

        <h2>Registered Students Records</h2>
        <div class="table-container">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data populated dynamically via scripts.js -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
